<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games | Superstar</title>
  <style>
    :root { color-scheme: dark; }
    :root[data-theme="light"] { color-scheme: light; }
    body { font-family: Arial, sans-serif; background: linear-gradient(160deg, #080d20, #101a35 55%, #171432); color: #f3f5ff; margin: 0; min-height:100vh; }
    .starfield { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
    header, main { position:relative; z-index:1; }
    header { z-index:10; display: flex; align-items: center; gap: 16px; padding: 16px 5%; background:rgba(11,17,38,.78); border-bottom:1px solid rgba(164,184,255,.16); box-shadow: 0 2px 12px rgba(0,0,0,.2); backdrop-filter:blur(8px); }
    h1 { margin: 0; font-size: 24px; }
    a { color: inherit; }
    .star-settings { position:relative; margin-left:auto; }
    .star-settings[open] { z-index:20; }
    .star-settings summary { list-style:none; cursor:pointer; background:#27365f; color:#f5f7ff; padding:9px 14px; border:1px solid rgba(190,205,255,.18); border-radius:7px; }
    .star-settings summary::-webkit-details-marker { display:none; }
    .settings-menu { position:absolute; z-index:21; right:0; top:calc(100% + 8px); width:230px; padding:14px; background:#111a34; border:1px solid rgba(164,184,255,.25); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.4); }
    .settings-menu label { display:block; margin:0 0 10px; }
    .settings-menu select { display:block; width:100%; margin-top:5px; background:#0b1228; color:#f3f5ff; border:1px solid #46557c; border-radius:6px; padding:9px; }
    main { width: 90%; max-width: 900px; margin: 24px auto; }
    .empty-state { background:rgba(17,26,52,.88); border:1px solid rgba(164,184,255,.18); padding: 28px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.24); }
    .empty-state p { color: #b7c1df; }
    button { background:#27365f; color:#f5f7ff; padding: 8px 15px; border:1px solid rgba(190,205,255,.18); border-radius: 7px; cursor: pointer; }
    button:hover { background:#384a7c; }
    :root[data-theme="light"] body { background:linear-gradient(160deg, #f3f6ff, #e5ecfb 55%, #eee9ff); color:#202945; }
    :root[data-theme="light"] .starfield { opacity:.55; }
    :root[data-theme="light"] header { background:rgba(255,255,255,.82); border-color:#d6def0; box-shadow:0 2px 12px rgba(48,64,100,.1); }
    :root[data-theme="light"] .star-settings summary,
    :root[data-theme="light"] button { background:#e1e8fa; color:#202945; border-color:#c3cee8; }
    :root[data-theme="light"] .star-settings summary:hover,
    :root[data-theme="light"] button:hover { background:#d1dcf5; }
    :root[data-theme="light"] .settings-menu { background:#fff; color:#202945; border-color:#cbd5eb; }
    :root[data-theme="light"] .settings-menu select { background:#fff; color:#202945; border-color:#b9c6e1; }
    :root[data-theme="light"] .empty-state { background:rgba(255,255,255,.9); border-color:#d6def0; box-shadow:0 10px 30px rgba(48,64,100,.12); }
    :root[data-theme="light"] .empty-state p { color:#53617e; }
    @media (prefers-reduced-motion: reduce) { .starfield { opacity:.65; } }
  </style>
</head>
<body>
  <canvas class="starfield" aria-hidden="true"></canvas>
  <header>
    <a href="/" aria-label="Back to dashboard"><button type="button">Back</button></a>
    <h1>Games</h1>
    <details class="star-settings">
      <summary>Star settings</summary>
      <div class="settings-menu">
        <label>Direction
          <select id="starDirection">
            <option value="down-right">Down-right</option>
            <option value="down-left">Down-left</option>
            <option value="up-right">Up-right</option>
            <option value="up-left">Up-left</option>
            <option value="down">Down</option>
            <option value="up">Up</option>
            <option value="right">Right</option>
            <option value="left" selected>Left (right to left)</option>
          </select>
        </label>
        <label>Speed
          <select id="starSpeed">
            <option value="slow">Slow</option>
            <option value="normal">Normal</option>
            <option value="fast">Fast</option>
          </select>
        </label>
        <label>Theme
          <select id="themeMode">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
      </div>
    </details>
  </header>
  <main>
    <section class="empty-state" aria-labelledby="games-heading">
      <h2 id="games-heading">Games coming soon</h2>
      <p>This is your games page. Add your games here whenever they’re ready.</p>
    </section>
  </main>
  <script src="/starfield.js" defer></script>
</body>
</html>
