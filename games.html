<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games | Superstar</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; color: #222; margin: 0; }
    header { display: flex; align-items: center; gap: 16px; padding: 16px 5%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
    h1 { margin: 0; font-size: 24px; }
    a { color: inherit; }
    main { width: 90%; max-width: 900px; margin: 24px auto; }
    .empty-state { background: white; padding: 28px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,.1); }
    .empty-state p { color: #555; }
    button { padding: 8px 15px; border: 0; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <a href="/" aria-label="Back to dashboard"><button type="button">Back</button></a>
    <h1>Games</h1>
  </header>
  <main>
    <section class="empty-state" aria-labelledby="games-heading">
      <h2 id="games-heading">Games coming soon</h2>
      <p>This is your games page. Add your games here whenever they’re ready.</p>
    </section>
  </main>
</body>
</html>
