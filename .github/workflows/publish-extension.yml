name: Build and publish Superstar extension update

on:
  push:
    branches: [main]
    paths:
      - "browser-extension/**"
      - ".github/workflows/publish-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: superstar-extension-release
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension manifest
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./browser-extension/manifest.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Extension version must use MAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node -e "const m=require('./browser-extension/manifest.json'); if(m.manifest_version!==3) process.exit(1); if(!m.update_url) { console.error('Missing update_url'); process.exit(1); }"

      - name: Restore the persistent signing key
        env:
          EXTENSION_PRIVATE_KEY_B64: ${{ secrets.EXTENSION_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "$EXTENSION_PRIVATE_KEY_B64" ]; then
            echo "::error::Add EXTENSION_PRIVATE_KEY_B64 in repository Actions secrets before publishing."
            exit 1
          fi
          printf '%s' "$EXTENSION_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/superstar-extension.pem"
          chmod 600 "$RUNNER_TEMP/superstar-extension.pem"
          openssl pkey -in "$RUNNER_TEMP/superstar-extension.pem" -noout

      - name: Build signed CRX and update manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install --global crx3@2.0.0
          crx3 --key "$RUNNER_TEMP/superstar-extension.pem" \
            --crx "$RUNNER_TEMP/Superstar.crx" \
            --xml "$RUNNER_TEMP/updates.xml" \
            --appVersion "$VERSION" \
            --crxURL "https://github.com/Dk7612/Superstar/releases/latest/download/Superstar.crx" \
            browser-extension
          test -s "$RUNNER_TEMP/Superstar.crx"
          test -s "$RUNNER_TEMP/updates.xml"
          grep -q "$VERSION" "$RUNNER_TEMP/updates.xml"

      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="extension-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Increase browser-extension/manifest.json version."
            exit 1
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/Superstar.crx#Superstar.crx" \
            "$RUNNER_TEMP/updates.xml#updates.xml" \
            --title "Superstar Extension v$VERSION" \
            --notes "Signed automatic-update package for Superstar Mini Window v$VERSION."
