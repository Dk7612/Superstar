<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suggest an Idea · Superstar</title><link rel="icon" href="/favicon.png">
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#080d20;color:#f3f5ff}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1c2b54,#080d20 65%);display:flex;flex-direction:column}
header,main,footer{width:min(720px,calc(100% - 32px));margin:0 auto}header{padding:24px 0}
header a{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-size:20px;font-weight:700}
header img{width:40px;height:40px;border-radius:10px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}header .settings-link{color:#dce4ff;text-decoration:none;padding:10px 13px;border:1px solid #435587;border-radius:9px}main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 0 60px}
.card{width:100%;padding:clamp(22px,5vw,38px);border:1px solid #435587;border-radius:18px;background:rgba(17,26,52,.92);box-shadow:0 18px 55px #0006}
h1{margin:0 0 10px;font-size:clamp(26px,5vw,36px)}p{color:#b8c5e8;line-height:1.6}
label{display:block;margin:22px 0 8px;font-weight:700}input,textarea{width:100%;padding:13px;border:1px solid #465780;border-radius:9px;background:#080f22;color:#fff;font:inherit}
textarea{min-height:150px;resize:vertical;line-height:1.5}button{margin-top:18px;padding:12px 19px;border:0;border-radius:9px;background:#586fe0;color:white;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#status{min-height:24px;margin-top:14px}footer{padding:20px 0 28px;text-align:center}footer a{color:#b8c5e8}
  :root[data-theme="light"]{color-scheme:light;background:#f3f6ff;color:#202945}
  :root[data-theme="light"] body{background:linear-gradient(160deg,#f3f6ff,#e5ecfb 55%,#eee9ff)}
  :root[data-theme="light"] .card{background:#fff;border-color:#d6def0}
  :root[data-theme="light"] p{color:#53617e}
  :root[data-theme="light"] input,:root[data-theme="light"] textarea{background:#fff;color:#202945;border-color:#b9c6e1}
</style>
<script>
try{const saved=JSON.parse(localStorage.getItem("superstar-starfield-settings-v2")||"null");if(saved&&["dark","light"].includes(saved.theme))document.documentElement.dataset.theme=saved.theme;}catch{}
try {
  const session = JSON.parse(sessionStorage.getItem("superstar-session"));
  if (sessionStorage.getItem("superstar-authenticated") === "1" && session &&
      session.role === "guest" && typeof session.sessionToken === "string") {
    document.documentElement.style.visibility = "hidden";
    fetch("/account/permissions", { headers: { "Authorization": "Bearer " + session.sessionToken }, cache: "no-store" })
      .then(response => response.ok ? response.json() : Promise.reject(new Error("Permission check failed")))
      .then(permissions => {
        if (permissions.ideas !== true) { window.location.replace("/"); return; }
        document.documentElement.style.visibility = "visible";
      })
      .catch(() => window.location.replace("/"));
  }
} catch { /* Public, unauthenticated idea submissions remain available. */ }
</script></head><body>
<header><a href="/"><img src="/favicon.png" alt="">Superstar</a><a class="settings-link" href="/settings" aria-label="Settings" title="Settings">⚙ Settings</a></header>
<main><section class="card"><h1>Share an idea</h1>
<p>Have an idea for Superstar? Suggest a new feature, a game, or a way to improve the site. Gemini will organize your suggestion before it reaches the private admin inbox.</p>
<form id="ideaForm"><label for="ideaTitle">Idea title</label>
<input id="ideaTitle" maxlength="100" placeholder="A short name for your idea" required>
<label for="ideaDescription">Describe your idea</label>
<textarea id="ideaDescription" maxlength="2000" placeholder="What should it do? How would it work?" required></textarea>
<button id="submitIdea" type="submit">Submit idea</button></form><p id="status" role="status" aria-live="polite"></p>
</section></main><footer><a href="/">Back to Superstar</a></footer>
<script>
const form=document.getElementById("ideaForm"),button=document.getElementById("submitIdea"),status=document.getElementById("status");
form.addEventListener("submit",async event=>{
 event.preventDefault();button.disabled=true;status.textContent="Sending your idea…";
 try{
  const response=await fetch("/api/ideas",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({title:document.getElementById("ideaTitle").value,description:document.getElementById("ideaDescription").value})});
  const result=await response.json();if(!response.ok)throw new Error(result.error||"Your idea could not be submitted.");
  form.reset();status.textContent="Thanks! Your idea was summarized and sent to the Superstar team.";
 }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
});
</script></body></html>
